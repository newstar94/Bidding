[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biddingflow"
version = "1.0.0"
description = "BiddingFlow procurement management backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "docxtpl==0.20.2",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    "uvicorn[standard]==0.49.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = true
