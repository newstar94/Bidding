[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biddingflow"
version = "2.0.0"
description = "BiddingFlow procurement management backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==50.0.0",
    "defusedxml==0.7.1",
    "docxtpl==0.20.2",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "psycopg[binary,pool]==3.3.4",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
test = [
    "cyclonedx-bom==7.3.0",
    "httpx2==2.7.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "B006", "B012"]

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = true

[tool.setuptools.package-data]
"backend.db" = ["postgres_schema_contract.json"]
"backend.documents.word_standardizer" = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
    "error::DeprecationWarning",
]
markers = [
    "browser_e2e: launches a real browser and must run in the Node/Playwright E2E environment",
]
