[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biddingflow"
version = "2.0.0"
description = "BiddingFlow procurement management backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==49.0.0",
    "defusedxml==0.7.1",
    "docxtpl==0.20.2",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "psycopg[binary,pool]==3.3.4",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    "uvicorn[standard]==0.49.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = true
