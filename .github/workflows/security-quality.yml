name: Security and quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-build-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-postgres-password
          POSTGRES_DB: biddingflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biddingflow_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONUTF8: "1"
      APP_ENV: test
      APP_DEBUG: "False"
      APP_SECURE_COOKIES: "False"
      DATABASE_URL: postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/biddingflow_dev?sslmode=disable
      DATABASE_ADMIN_URL: postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/biddingflow_dev?sslmode=disable
      RUNTIME_DATABASE_URL: postgresql://biddingflow_app:ci-test-runtime-password@127.0.0.1:5432/biddingflow_dev?sslmode=disable
      MIGRATOR_DATABASE_URL: postgresql://biddingflow_migrator:ci-test-migrator-password@127.0.0.1:5432/biddingflow_dev?sslmode=disable
      BACKUP_DATABASE_URL: postgresql://biddingflow_backup:ci-test-backup-password@127.0.0.1:5432/biddingflow_dev?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/biddingflow_test?sslmode=disable
      API_TEST_DATABASE_URL: postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/biddingflow_api_test?sslmode=disable
      MULTIWORKER_TEST_DATABASE_URL: postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/biddingflow_multiworker_test?sslmode=disable
      RESTORE_DRILL_DATABASE_URL: postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/biddingflow_restore_drill?sslmode=disable
      PACKAGE_SMOKE_DATABASE_URL: postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/biddingflow_package_smoke?sslmode=disable
      DATABASE_RUNTIME_ROLE: biddingflow_app
      DATABASE_RUNTIME_PASSWORD: ci-test-runtime-password
      DATABASE_MIGRATOR_ROLE: biddingflow_migrator
      DATABASE_MIGRATOR_PASSWORD: ci-test-migrator-password
      DATABASE_BACKUP_ROLE: biddingflow_backup
      DATABASE_BACKUP_PASSWORD: ci-test-backup-password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CI-admin-password-2026-Strong!
      EMAIL_OUTBOX_ENCRYPTION_KEY: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
      AUDIT_CHECKPOINT_HMAC_KEY: ci-audit-checkpoint-key-that-is-over-32-bytes
      AUDIT_CHECKPOINT_DIR: ""
      ENABLE_IMAGE_CACHE_PREWARM: "false"
      ENABLE_PARTNER_LOOKUP_WORKER: "false"
      BACKGROUND_STARTUP_DELAY_SECONDS: "0"
      DOCUMENT_WORKER_TEMP_DIR: /tmp/biddingflow-document-worker
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies and Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor bubblewrap libseccomp2
          sudo install -o root -g root -m 0644 deploy/apparmor-biddingflow-bwrap /etc/apparmor.d/biddingflow-bwrap
          sudo apparmor_parser --replace /etc/apparmor.d/biddingflow-bwrap
          python -m pip install --require-hashes --no-deps -r requirements.txt
          python -m pip install --require-hashes -r requirements-ci.txt
          npm ci --ignore-scripts

      - name: Create disposable PostgreSQL databases
        run: |
          for database in biddingflow_test biddingflow_api_test biddingflow_multiworker_test biddingflow_restore_drill biddingflow_package_smoke; do
            psql postgresql://postgres:ci-test-postgres-password@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${database}"
          done
          python scripts/configure_database_roles.py
          python scripts/manage_database.py
          python scripts/configure_database_roles.py

      - name: Compile and run security source gates
        run: |
          python -m compileall -q backend scripts tests
          python scripts/security_static_gate.py
          python scripts/scan_tracked_secrets.py
          bandit -r backend scripts -x tests -lll -q

      - name: Verify real Linux document sandbox boundary
        run: python scripts/verify_document_sandbox.py

      - name: Run PostgreSQL application tests and enforce coverage
        run: |
          pytest -q tests --cov=backend --cov-branch --cov-report=term --cov-report=json:coverage.json
          python scripts/check_coverage_thresholds.py coverage.json

      - name: Build secure frontend and audit dependencies
        run: |
          npm run build:secure
          npm audit --audit-level=high
          pip-audit --requirement requirements.txt

      - name: Validate and create production archive
        run: |
          python scripts/package_production.py --check
          python scripts/package_production.py

      - name: Generate CycloneDX evidence and checksums
        run: |
          mkdir -p release/evidence
          cp coverage.json release/evidence/backend-coverage.json
          cyclonedx-py requirements requirements.txt --pyproject pyproject.toml --output-reproducible --output-file release/evidence/python-sbom.cdx.json
          node scripts/generate_npm_sbom.mjs
          python scripts/generate_vendor_sbom.py
          sha256sum release/biddingflow-production.zip release/evidence/*.json > release/evidence/SHA256SUMS

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: biddingflow-${{ github.sha }}
          path: |
            release/biddingflow-production.zip
            release/evidence/
          if-no-files-found: error
          retention-days: 30
