name: Production CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Lint, unit and static audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/release_preflight.py quality

  api:
    name: API, migration and restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: python scripts/release_preflight.py api

  supply-chain:
    name: Dependencies, secrets, vendor and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: npm ci
      - run: python scripts/release_preflight.py security
      - uses: actions/upload-artifact@v4
        with:
          name: software-bills-of-materials
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    name: Secure build and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: npm ci
      - run: python scripts/release_preflight.py package --artifact release/biddingflow-production.zip
      - uses: actions/upload-artifact@v4
        with:
          name: production-package-smoke-candidate
          path: release/biddingflow-production.zip
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Chromium end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/release_preflight.py e2e

  release-gate:
    name: Required CI release gate
    if: always()
    needs:
      - quality
      - api
      - supply-chain
      - package-smoke
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every automated gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          for result in "$QUALITY_RESULT" "$API_RESULT" "$SUPPLY_CHAIN_RESULT" "$PACKAGE_RESULT" "$E2E_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required automated gate did not pass: $result" >&2
              exit 1
            fi
          done
          echo "All automated release gates passed."
      - name: Write revision-bound CI evidence
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: python scripts/write_ci_evidence.py --output release-evidence/ci-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-ci-evidence-${{ github.sha }}
          path: release-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 30
