name: Production CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Lint, unit and static audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/release_preflight.py quality

  api:
    name: API, migration and restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: python scripts/release_preflight.py api

  postgresql-api:
    name: PostgreSQL API and integration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only # pragma: allowlist secret -- ephemeral CI service only
          POSTGRES_DB: biddingflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biddingflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BIDDING_DATABASE_URL: postgresql://postgres:postgres-ci-only@127.0.0.1:5432/biddingflow_ci?sslmode=disable # pragma: allowlist secret -- loopback CI only
      BIDDING_TEST_POSTGRESQL_URL: postgresql://postgres:postgres-ci-only@127.0.0.1:5432/postgres?sslmode=disable # pragma: allowlist secret -- loopback CI only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: python -m pytest tests/api -q
      - name: Enforce PostgreSQL connection budget
        run: >-
          python scripts/validate_postgresql_connection_budget.py
          --output release-evidence/postgresql-connection-budget.json
      - name: Enforce RPO, RTO and retention contract
        run: >-
          python scripts/validate_recovery_objectives.py
          --output release-evidence/recovery-objectives.json
      - name: Enforce PostgreSQL query-plan budgets
        run: >-
          python scripts/benchmark_postgresql_queries.py
          --output release-evidence/postgresql-query-benchmark.json
      - name: Exercise PostgreSQL pool sizes under mixed DB load
        run: >-
          python scripts/benchmark_postgresql_pool.py
          --output release-evidence/postgresql-pool-benchmark.json
      - name: Soak PostgreSQL connection and transaction lifecycle
        run: >-
          python scripts/benchmark_postgresql_pool.py
          --operations 20000
          --pool-sizes 2,10
          --output release-evidence/postgresql-pool-soak.json
      - name: Rehearse fresh install and rollback recreate
        run: >-
          python scripts/rehearse_postgresql_fresh_install.py
          --allow-insecure-local
          --output release-evidence/postgresql-fresh-install.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-contract-evidence-${{ github.sha }}
          path: |
            release-evidence/postgresql-connection-budget.json
            release-evidence/postgresql-pool-benchmark.json
            release-evidence/postgresql-pool-soak.json
            release-evidence/postgresql-query-benchmark.json
            release-evidence/postgresql-fresh-install.json
            release-evidence/recovery-objectives.json
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: Dependencies, secrets, vendor and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: npm ci
      - run: python scripts/release_preflight.py security
      - uses: actions/upload-artifact@v4
        with:
          name: software-bills-of-materials
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    name: Secure build and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: npm ci
      - run: python scripts/release_preflight.py package --artifact release/biddingflow-production.zip
      - uses: actions/upload-artifact@v4
        with:
          name: production-package-smoke-candidate
          path: release/biddingflow-production.zip
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Cross-browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python scripts/release_preflight.py e2e

  release-gate:
    name: Required CI release gate
    if: always()
    needs:
      - quality
      - api
      - postgresql-api
      - supply-chain
      - package-smoke
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every automated gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api.result }}
          POSTGRESQL_API_RESULT: ${{ needs.postgresql-api.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          for result in "$QUALITY_RESULT" "$API_RESULT" "$POSTGRESQL_API_RESULT" "$SUPPLY_CHAIN_RESULT" "$PACKAGE_RESULT" "$E2E_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required automated gate did not pass: $result" >&2
              exit 1
            fi
          done
          echo "All automated release gates passed."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Write revision-bound CI evidence
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api.result }}
          POSTGRESQL_API_RESULT: ${{ needs.postgresql-api.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: python scripts/write_ci_evidence.py --output release-evidence/ci-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-ci-evidence-${{ github.sha }}
          path: release-evidence/ci-evidence.json
          if-no-files-found: error
          retention-days: 30
