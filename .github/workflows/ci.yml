name: Full CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317 # 17.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: biddingflow_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d biddingflow_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      APP_DEBUG: "False"
      APP_SECURE_COOKIES: "False"
      APP_PUBLIC_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql://postgres:ci-database-password@127.0.0.1:5432/biddingflow_ci_test?sslmode=disable
      MIGRATOR_DATABASE_URL: postgresql://postgres:ci-database-password@127.0.0.1:5432/biddingflow_ci_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:ci-database-password@127.0.0.1:5432/biddingflow_ci_unit_test?sslmode=disable
      API_TEST_DATABASE_URL: postgresql://postgres:ci-database-password@127.0.0.1:5432/biddingflow_ci_api_test?sslmode=disable
      DATABASE_AUTO_MIGRATE: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CI-only-admin-password-2026!
      E2E_USERNAME: admin
      E2E_PASSWORD: CI-only-admin-password-2026!
      AUDIT_CHECKPOINT_DIR: ""
      ENABLE_IMAGE_CACHE_PREWARM: "false"
      ENABLE_PARTNER_LOOKUP_WORKER: "false"
      TURNSTILE_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Create isolated test databases
        env:
          PGPASSWORD: ci-database-password
        run: |
          createdb --host 127.0.0.1 --username postgres biddingflow_ci_unit_test
          createdb --host 127.0.0.1 --username postgres biddingflow_ci_api_test
      - name: Initialize fresh PostgreSQL schemas
        run: |
          python scripts/manage_database.py
          DATABASE_URL="$TEST_DATABASE_URL" MIGRATOR_DATABASE_URL="$TEST_DATABASE_URL" python scripts/manage_database.py
          DATABASE_URL="$API_TEST_DATABASE_URL" MIGRATOR_DATABASE_URL="$API_TEST_DATABASE_URL" python scripts/manage_database.py
      - name: Python compile
        run: python -m compileall -q backend scripts tests
      - name: Generated schema drift
        run: npm run check:schema-runtime
      - name: Python lint and quality
        run: npm run lint:python
      - name: ESLint and Trusted Types
        run: npm run lint:security
      - name: Frontend debt gate
        run: npm run lint:debt
      - name: Python tests and coverage
        run: >-
          python -m pytest -q
          --junitxml=pytest-junit.xml
          --cov=backend --cov-branch
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-fail-under=45
          && python scripts/check_critical_coverage.py coverage.json
      - name: JavaScript tests
        env:
          JS_JUNIT_PATH: javascript-junit.xml
        run: npm run test:js:coverage
      - name: Secure build
        run: |
          set -o pipefail
          npm run build:secure 2>&1 | tee secure-build.log
      - name: Upload private client symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biddingflow-private-client-symbols-${{ github.sha }}
          path: release/private-symbols/
          if-no-files-found: error
          retention-days: 30
      - name: FK and index audit
        run: python scripts/audit_fk_indexes.py
      - name: Production package validation
        run: |
          set -o pipefail
          python scripts/package_production.py --check 2>&1 | tee package-validation.log
      - name: SBOM
        run: npm run sbom
      - name: Start isolated E2E application
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 --no-proxy-headers > /tmp/biddingflow-e2e.log 2>&1 &
          echo $! > /tmp/biddingflow-e2e.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biddingflow-e2e.log
          exit 1
      - name: Performance budget
        run: npm run test:performance
      - name: Cross-browser Playwright matrix
        run: npm run test:e2e:smoke
      - name: Full role and workflow E2E
        run: |
          set -o pipefail
          exec > >(tee -a e2e-tests.log) 2>&1
          npm run test:auth-shell
          npm run test:auth-roles-e2e
          npm run test:bidder-goods-e2e
          npm run test:crud-modules-e2e
          npm run test:multi-assignee-e2e
          npm run test:joint-venture-e2e
          npm run test:low-price-conflict-e2e
          npm run test:offline-sync-e2e:soak
          npm run test:package-pairwise-e2e
          npm run test:lifecycle
          npm run test:ui-quality-e2e
      - name: Stop E2E application
        if: always()
        run: |
          if [ -f /tmp/biddingflow-e2e.pid ]; then kill "$(cat /tmp/biddingflow-e2e.pid)" || true; fi
          if [ "${{ job.status }}" != "success" ]; then cat /tmp/biddingflow-e2e.log || true; fi
      - name: Dependency audit
        run: |
          set -o pipefail
          npm run audit:dependencies 2>&1 | tee dependency-audit.log
      - name: Build reproducible production archive
        run: npm run package:production
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biddingflow-ci-diagnostics-${{ github.sha }}
          path: |
            pytest-junit.xml
            coverage.xml
            coverage.json
            javascript-junit.xml
            secure-build.log
            package-validation.log
            dependency-audit.log
            e2e-tests.log
            playwright-report
            test-results/e2e-junit.xml
            test-results/e2e-results.json
            /tmp/biddingflow-e2e.log
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload production artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biddingflow-production-${{ github.sha }}
          path: |
            release/biddingflow-production.zip
            release/npm-sbom.cdx.json
            release/python-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
