name: N+1 query regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  query-count-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run deterministic query-count regressions
        run: python -m pytest -q tests/test_n_plus_one_regressions.py
