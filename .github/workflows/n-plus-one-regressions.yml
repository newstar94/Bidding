name: N+1 query regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  query-count-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Run deterministic query-count regressions
        run: python -m pytest -q tests/test_n_plus_one_regressions.py
