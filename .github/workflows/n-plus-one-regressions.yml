name: N+1 query regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  query-count-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run deterministic query-count regressions
        run: python -m pytest -q tests/test_n_plus_one_regressions.py
