name: Startup performance gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "views/**"
      - "scripts/measure_startup.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317 # 17.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-startup-password
          POSTGRES_DB: biddingflow_startup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biddingflow_startup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      APP_DEBUG: "False"
      APP_SECURE_COOKIES: "False"
      DATABASE_URL: postgresql://postgres:ci-startup-password@127.0.0.1:5432/biddingflow_startup?sslmode=disable
      DATABASE_AUTO_MIGRATE: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CI-startup-admin-password-2026!
      EMAIL_OUTBOX_ENCRYPTION_KEY: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
      AUDIT_CHECKPOINT_HMAC_KEY: ci-startup-audit-key-that-is-longer-than-32-bytes
      AUDIT_CHECKPOINT_DIR: ""
      ENABLE_IMAGE_CACHE_PREWARM: "false"
      ENABLE_PARTNER_LOOKUP_WORKER: "false"
      BACKGROUND_STARTUP_DELAY_SECONDS: "0"
      STARTUP_COLD_RUNS: "30"
      STARTUP_WARM_RUNS: "30"
      STARTUP_COLD_P95_MS: "800"
      STARTUP_WARM_P95_MS: "300"
      STARTUP_LONG_TASK_MS: "100"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build secure frontend
        run: npm run build:secure
      - name: Start application
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > startup-server.log 2>&1 &
          for attempt in {1..120}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat startup-server.log
          exit 1
      - name: Enforce startup thresholds
        run: |
          npm run test:auth-shell
          npm run test:performance
      - name: Upload startup measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-performance-${{ github.sha }}
          path: |
            data/logs/startup-performance.json
            startup-server.log
          if-no-files-found: ignore
          retention-days: 14
