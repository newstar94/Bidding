<!-- ================= TAB: GÓI THẦU CHI TIẾT WORKFLOW ================= -->
<section class="tab-pane" id="tab-goithau-detail">
    <div class="card"
        style="margin-bottom: 24px; border: 1px solid var(--border-color); border-radius: var(--radius-lg); background: var(--bg-card); overflow: hidden;">
        <div class="card-header"
            style="padding: 20px 24px; border-bottom: 1px solid var(--border-color); background: rgba(59, 130, 246, 0.02); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                    <span id="detail-workflow-code" class="detail-code"
                        style="font-size: 0.85rem; padding: 4px 10px; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.15); color: var(--primary); border-radius: 4px; font-weight: 700; margin: 0; display: inline-flex; align-items: center; height: 28px; box-sizing: border-box;">--</span>
                    <select id="detail-workflow-version-select" style="font-size: 0.85rem; padding: 0 24px 0 10px; height: 28px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-card); color: var(--text-main); font-weight: 700; cursor: pointer; display: none; margin: 0; box-sizing: border-box; line-height: 26px; outline: none; vertical-align: middle;">
                    </select>
                    <span id="detail-workflow-status-badge" style="display: inline-flex; align-items: center; margin: 0;">--</span>
                </div>
                <h3 id="detail-workflow-title"
                    style="margin: 0; font-size: 1.25rem; font-weight: 800; color: var(--text-main);">
                    Tên gói thầu</h3>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button class="btn btn-primary btn-edit" id="btn-edit-goithau-fullpage"
                     style="padding: 10px 20px; font-weight: 600; display: flex; align-items: center; gap: 6px; height: 38px;">
                     <i data-lucide="edit" style="width: 16px; height: 16px;"></i> Sửa gói thầu
                </button>
                <button class="btn btn-primary btn-edit" id="btn-edit-award-result"
                     style="padding: 10px 20px; font-weight: 600; display: none; align-items: center; gap: 6px; height: 38px;">
                     <i data-lucide="edit" style="width: 16px; height: 16px;"></i> Sửa kết quả
                </button>
                <button class="btn btn-outline" onclick="window.switchTab('goithau')"
                    style="padding: 10px 20px; font-weight: 600; display: flex; align-items: center; gap: 6px; height: 38px;">
                    <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> Quay lại danh sách
                </button>
            </div>
        </div>

        <div class="card-body" style="padding: 24px;">
            <!-- Top Workflow Navigation Tabs -->
            <div id="detail-workflow-tabs-header"
                style="display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 24px; gap: 4px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px;">
                <!-- Tabs dynamically generated -->
            </div>

            <!-- Content Wrapper -->
            <div id="detail-workflow-content-wrapper">
                <!-- Dynamic Tab Content -->
            </div>
        </div>
    </div>
</section>
