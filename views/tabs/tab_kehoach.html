<!-- ================= TAB: KẾ HOẠCH LCNT ================= -->
<section class="tab-pane" id="tab-kehoach">
    <div class="table-actions-bar">
        <div class="search-filter-group">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" placeholder="Tìm kế hoạch (mã, tên)..." id="search-kehoach">
            </div>
            <div class="select-wrapper" style="width: 85px;">
                <select id="filter-kehoach-nam" style="width: 100%;">
                    <option value="">Năm</option>
                </select>
            </div>
            <div class="select-wrapper" style="width: 85px;">
                <select id="filter-kehoach-thang" style="width: 100%;">
                    <option value="">Tháng</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn-excel-action btn-download-excel-template-direct" data-type="kehoach">
                <i data-lucide="download"></i> Tải Excel Mẫu
            </button>
            <button class="btn-excel-action btn-import-excel-direct" data-type="kehoach">
                <i data-lucide="upload"></i> Nhập từ Excel
            </button>
            <button class="btn btn-primary" id="btn-add-kehoach">
                <i data-lucide="plus"></i> Thêm Kế hoạch mới
            </button>
        </div>
    </div>

    <div class="table-container">
        <table class="data-table" id="kehoach-table">
            <thead>
                <tr>
                    <th>Mã Kế Hoạch</th>
                    <th>Tên Kế Hoạch Lựa Chọn Nhà Thầu</th>
                    <th>Phân loại</th>
                    <th>Dự án / Dự toán</th>
                    <th>Chủ Đầu Tư</th>
                    <th>Tổng Giá Trị</th>
                    <th>Ngày Phê Duyệt</th>
                    <th>Số QĐ</th>
                    <th>Thời Gian Đăng Mã</th>
                    <th class="text-right">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rendered via JS -->
            </tbody>
        </table>
    </div>
    <div class="pagination-container" id="kehoach-pagination"></div>
</section>
