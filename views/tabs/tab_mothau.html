                                            <button class="btn btn-outline btn-sm" id="btn-mothau-add-bid"
                                                style="padding: 6px 12px; font-size: 0.82rem; font-weight: 600;">

                                            </button>
                                        </div>
                                    </div>

                                    <div class="table-container"
                                        style="border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow-x: auto; margin-bottom: 24px;">

                                            </thead>

                                        <button class="btn btn-primary" id="btn-mothau-save"
                                            style="padding: 10px 24px; font-weight: 700;">
