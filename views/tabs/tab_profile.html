
                <section class="tab-pane" id="tab-profile">
                    <div class="dashboard-grid bf-s-a57057342c">


                        <div class="dashboard-card">
                            <div class="card-header">
                                <h3 class="card-title">Cập nhật Thông tin cá nhân</h3>
                                <i data-lucide="user-cog" class="text-muted"></i>
                            </div>
                            <form id="form-profile-update" novalidate>
                                <div class="card-body">

                                    <div class="profile-avatar-upload-container bf-s-f1b5c8818e"
                                       >
                                        <div class="avatar-preview-wrapper bf-s-28023c7fe8"
                                           >
                                            <img id="profile-avatar-preview" src="" alt="Avatar"
                                                class="bf-s-0c80b285ce">
                                            <div id="profile-avatar-fallback"
                                                class="bf-s-75c80c932b">
                                                AD</div>
                                        </div>
                                        <label for="profile-avatar-input" class="btn btn-outline btn-sm bf-s-912ef267f6"
                                           >
                                            <i data-lucide="camera" class="bf-s-58050124fc"></i>
                                            <span>Chọn ảnh đại diện</span>
                                        </label>
                                        <input type="file" id="profile-avatar-input" accept="image/*"
                                            class="bf-s-65d1f1c3d7">
                                    </div>

                                    <div class="form-group bf-s-04390d6d23">
                                        <label for="profile-username">Tên tài khoản (Username)</label>
                                        <input type="text" id="profile-username" readonly disabled
                                            class="bf-s-1bbff8c60f">
                                    </div>
                                    <div class="form-group bf-s-04390d6d23">
                                        <label for="profile-fullname">Họ và tên <span class="required">*</span></label>
                                        <input type="text" id="profile-fullname" required
                                            placeholder="Nhập họ và tên của bạn">
                                        <span class="error-text">Họ và tên không được để trống</span>
                                    </div>
                                    <div class="form-group bf-s-79cbf79464">
                                        <label for="profile-email">Địa chỉ Email <span class="required">*</span></label>
                                        <input type="email" id="profile-email" required
                                            placeholder="Nhập địa chỉ email của bạn">
                                        <span class="error-text">Email không hợp lệ</span>
                                    </div>
                                    <div class="form-group bf-s-2bc05485a8" id="profile-org-container"
                                       >
                                        <label for="profile-organization">Tên tổ chức / Doanh nghiệp</label>
                                        <input type="text" id="profile-organization"
                                            placeholder="Tên tổ chức, doanh nghiệp của bạn" readonly
                                            aria-describedby="profile-organization-help">
                                        <small id="profile-organization-help" class="text-muted">Tên tổ chức chỉ có thể thay đổi trong phần quản trị tổ chức.</small>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-full-width">
                                        <i data-lucide="save"></i> Cập nhật hồ sơ
                                    </button>
                                </div>
                            </form>
                        </div>


                        <div class="dashboard-card">
                            <div class="card-header">
                                <h3 class="card-title">Đổi mật khẩu bảo mật</h3>
                                <i data-lucide="shield-alert" class="text-muted"></i>
                            </div>
                            <form id="form-profile-password" novalidate>
                                <div class="card-body">
                                    <div class="form-group bf-s-04390d6d23">
                                        <label for="profile-old-password">Mật khẩu cũ <span
                                                class="required">*</span></label>
                                        <input type="password" id="profile-old-password" required maxlength="256"
                                            placeholder="Nhập mật khẩu hiện tại">
                                        <span class="error-text">Vui lòng nhập mật khẩu cũ</span>
                                    </div>
                                    <div class="form-group bf-s-04390d6d23">
                                        <label for="profile-new-password">Mật khẩu mới <span
                                                class="required">*</span></label>
                                        <input type="password" id="profile-new-password" required minlength="8" maxlength="256"
                                            autocomplete="new-password" placeholder="Nhập mật khẩu mới (tối thiểu 8 ký tự)">
                                        <span class="error-text">Mật khẩu mới cần tối thiểu 8 ký tự</span>
                                    </div>
                                    <div class="form-group bf-s-79cbf79464">
                                        <label for="profile-confirm-password">Xác nhận mật khẩu mới <span
                                                class="required">*</span></label>
                                        <input type="password" id="profile-confirm-password" required minlength="8" maxlength="256"
                                            autocomplete="new-password"
                                            placeholder="Nhập lại mật khẩu mới">
                                        <span class="error-text">Xác nhận mật khẩu phải trùng khớp với mật khẩu
                                            mới</span>
                                    </div>
                                    <button type="submit" class="btn btn-purple btn-full-width">
                                        <i data-lucide="key-round"></i> Đổi mật khẩu đăng nhập
                                    </button>
                                </div>
                            </form>
                        </div>

                    </div>
                </section>
