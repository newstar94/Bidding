    <!-- Modal: Chỉnh sửa Gói dịch vụ thương mại -->
    <div class="modal-overlay" id="modal-edit-package">
        <div class="modal-card" style="max-width: 500px; width: 90%;">
            <div class="modal-header">
                <h3>Chỉnh sửa Gói Dịch Vụ</h3>
                <button class="modal-close" data-close="modal-edit-package">&times;</button>
            </div>
            <form id="form-edit-package" novalidate>
                <input type="hidden" id="edit-pkg-id">
                <div class="modal-body">
                    <div class="form-grid" style="grid-template-columns: 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="edit-pkg-name">Tên gói dịch vụ <span class="required">*</span></label>
                            <input type="text" id="edit-pkg-name" required placeholder="Ví dụ: Gói Vàng (Gold)">
                            <span class="error-text">Vui lòng nhập tên gói</span>
                        </div>
                        <div class="form-group">
                            <label for="edit-pkg-price">Đơn giá (VND/năm) <span class="required">*</span></label>
                            <input type="text" id="edit-pkg-price" required placeholder="Ví dụ: 35.000.000">
                            <span class="error-text">Vui lòng nhập đơn giá hợp lệ</span>
                        </div>
                        <div class="form-group">
                            <label for="edit-pkg-quota">Hạn mức nhân viên tối đa <span class="required">*</span></label>
                            <input type="number" id="edit-pkg-quota" required
                                placeholder="Ví dụ: 15 (Nhập 999 nếu không giới hạn)">
                            <span class="error-text">Vui lòng nhập số nhân sự hợp lệ</span>
                        </div>
                        <div class="form-group">
                            <label for="edit-pkg-desc">Mô tả tóm tắt <span class="required">*</span></label>
                            <textarea id="edit-pkg-desc" required rows="3"
                                placeholder="Mô tả quyền lợi và đối tượng áp dụng gói"
                                style="width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border-color); padding: 8px; font-family: inherit; background: var(--bg-card); color: var(--text-main);"></textarea>
                            <span class="error-text">Vui lòng nhập mô tả gói</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-close="modal-edit-package">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
