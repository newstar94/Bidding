<div class="modal-overlay" id="modal-procurement-notice-import">
    <div class="modal-card procurement-import" aria-describedby="procurement-notice-import-description">
        <div class="modal-header">
            <div>
                <p class="procurement-import__eyebrow">Cập nhật dữ liệu tự động</p>
                <h3 id="modal-procurement-notice-import-title">Cập nhật gói thầu theo mã IB</h3>
            </div>
            <button type="button" class="modal-close" data-close="modal-procurement-notice-import" aria-label="Đóng trình cập nhật">&times;</button>
        </div>
        <div class="modal-body">
            <p id="procurement-notice-import-description" class="helper-text">
                Thông báo chỉ được gắn vào gói hiện hữu sau khi nguồn và quan hệ KHLCNT được xác định chính xác.
            </p>
            <section class="procurement-import__controls" aria-label="Chọn thông báo nguồn">
                <div class="form-group">
                    <label for="procurement-notice-import-code">Mã thông báo</label>
                    <input id="procurement-notice-import-code" data-procurement-notice-code autocomplete="off" inputmode="text" placeholder="IB2600026487 hoặc IB2600026487-01">
                </div>
                <div class="form-group">
                    <label for="procurement-notice-import-mode">Phạm vi phiên bản</label>
                    <select id="procurement-notice-import-mode" data-procurement-notice-mode>
                        <option value="LATEST">Phiên bản mới nhất</option>
                        <option value="SELECTED">Phiên bản được chọn</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="procurement-notice-import-revision">Phiên bản nguồn</label>
                    <select id="procurement-notice-import-revision" data-procurement-notice-revision>
                        <option value="">Tự xác định</option>
                    </select>
                </div>
                <button type="button" class="btn btn-outline procurement-import__prepare" data-procurement-notice-prepare>Chuẩn bị preview</button>
            </section>
            <div class="procurement-import__status" data-procurement-notice-status aria-live="polite" aria-atomic="true">Nhập mã IB để bắt đầu.</div>
            <ul class="procurement-import__issues" data-procurement-notice-issues hidden></ul>
            <section class="procurement-import__panel" aria-labelledby="procurement-notice-target-heading">
                <div class="procurement-import__panel-heading">
                    <h4 id="procurement-notice-target-heading">Gói thầu nhận cập nhật</h4>
                    <span data-procurement-notice-summary>Chưa có preview</span>
                </div>
                <dl class="procurement-import__facts" data-procurement-notice-preview></dl>
            </section>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" data-close="modal-procurement-notice-import">Hủy</button>
            <button type="button" class="btn btn-primary" data-procurement-notice-apply disabled>Cập nhật gói thầu</button>
        </div>
    </div>
</div>
