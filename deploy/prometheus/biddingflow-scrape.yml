# Merge this job into the production Prometheus configuration. The bundled
# application service listens on loopback, so a host-local Prometheus/agent is
# the safest default. Store the optional bearer token outside this repository.
scrape_configs:
  - job_name: biddingflow
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          service: biddingflow
          environment: production
    # bearer_token_file: /run/secrets/biddingflow-metrics-token

  # Install these exporters as separate least-privilege services on the private
  # network. Their ports must never be exposed through the public firewall.
  - job_name: biddingflow-node
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: biddingflow
          environment: production

  - job_name: biddingflow-postgresql
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:9187"]
        labels:
          service: biddingflow
          environment: production
