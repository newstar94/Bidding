groups:
  - name: biddingflow-production
    interval: 30s
    rules:
      - alert: BiddingFlowTargetDown
        expr: up{job="biddingflow"} == 0
        for: 2m
        labels: {severity: critical, owner: platform-oncall}
        annotations:
          summary: "BiddingFlow metrics target is unavailable"
          runbook: "docs/RUNBOOK.md#metrics-slo-va-canh-bao"

      - alert: BiddingFlowHigh5xxRate
        expr: |
          sum(rate(biddingflow_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(biddingflow_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels: {severity: critical, owner: application-oncall}
        annotations:
          summary: "HTTP 5xx ratio is above 2%"
          runbook: "docs/RUNBOOK.md#metrics-slo-va-canh-bao"

      - alert: BiddingFlowHigh429Rate
        expr: |
          sum(rate(biddingflow_http_rate_limited_total[5m]))
          / clamp_min(sum(rate(biddingflow_http_requests_total[5m])), 0.001) > 0.10
        for: 15m
        labels: {severity: warning, owner: application-oncall}
        annotations:
          summary: "Application 429 ratio is above 10%"
          runbook: "docs/RUNBOOK.md#metrics-slo-va-canh-bao"

      - alert: BiddingFlowHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(biddingflow_http_request_duration_seconds_bucket[5m]))) > 1
          and sum(rate(biddingflow_http_requests_total[5m])) > 0
        for: 10m
        labels: {severity: warning, owner: application-oncall}
        annotations:
          summary: "Overall HTTP p95 latency is above 1 second"
          runbook: "docs/RUNBOOK.md#metrics-slo-va-canh-bao"

      - alert: BiddingFlowEventLoopLag
        expr: biddingflow_event_loop_lag_seconds > 0.5
        for: 5m
        labels: {severity: critical, owner: application-oncall}
        annotations:
          summary: "ASGI event-loop lag is above 500 ms"
          runbook: "docs/RUNBOOK.md#database-lock-hoac-wal-tang-bat-thuong"

      - alert: BiddingFlowWorkerQueuePressure
        expr: |
          biddingflow_worker_pool_queued
          / clamp_min(biddingflow_worker_pool_capacity, 1) > 0.8
        for: 5m
        labels: {severity: warning, owner: application-oncall}
        annotations:
          summary: "A bounded worker queue is above 80% capacity"
          runbook: "docs/RUNBOOK.md#metrics-slo-va-canh-bao"

      - alert: BiddingFlowWorkerRejectingWork
        expr: increase(biddingflow_worker_pool_rejected_total[5m]) > 0
        for: 2m
        labels: {severity: warning, owner: application-oncall}
        annotations:
          summary: "A bounded worker pool rejected work"
          runbook: "docs/RUNBOOK.md#metrics-slo-va-canh-bao"

      - alert: BiddingFlowDocumentWorkerRejectingWork
        expr: increase(biddingflow_document_worker_rejected_total[10m]) > 0
        labels: {severity: warning, owner: application-oncall}
        annotations:
          summary: "Document worker rejected queued exports/imports"
          runbook: "docs/RUNBOOK.md#metrics-slo-va-canh-bao"

      - alert: BiddingFlowSQLiteBusy
        expr: increase(biddingflow_sqlite_busy_total[5m]) > 0
        for: 2m
        labels: {severity: warning, owner: database-oncall}
        annotations:
          summary: "SQLite busy/locked errors are occurring"
          runbook: "docs/RUNBOOK.md#database-lock-hoac-wal-tang-bat-thuong"

      - alert: BiddingFlowAuditChainInvalid
        expr: |
          biddingflow_audit_chain_check_available == 1
          and biddingflow_audit_chain_valid == 0
        for: 1m
        labels: {severity: critical, owner: security-oncall}
        annotations:
          summary: "Audit hash chain verification failed"
          runbook: "docs/RUNBOOK.md#audit-chain-khong-hop-le"

      - alert: BiddingFlowAuditChainVerifierUnavailable
        expr: biddingflow_audit_chain_check_available == 0
        for: 10m
        labels: {severity: critical, owner: security-oncall}
        annotations:
          summary: "Audit hash chain verifier cannot complete"
          runbook: "docs/RUNBOOK.md#audit-chain-khong-hop-le"

      - alert: BiddingFlowAuditChainVerifierStale
        expr: time() - biddingflow_audit_chain_last_check_timestamp_seconds > 900
        for: 10m
        labels: {severity: warning, owner: security-oncall}
        annotations:
          summary: "Audit hash chain has not been checked for 15 minutes"
          runbook: "docs/RUNBOOK.md#audit-chain-khong-hop-le"

      - alert: BiddingFlowWALTooLarge
        expr: biddingflow_sqlite_wal_bytes > 536870912
        for: 15m
        labels: {severity: warning, owner: database-oncall}
        annotations:
          summary: "SQLite WAL is larger than 512 MiB"
          runbook: "docs/RUNBOOK.md#database-lock-hoac-wal-tang-bat-thuong"

      - alert: BiddingFlowDiskSpaceLow
        expr: |
          biddingflow_disk_free_bytes
          / clamp_min(biddingflow_disk_total_bytes, 1) < 0.15
        for: 15m
        labels: {severity: critical, owner: platform-oncall}
        annotations:
          summary: "Managed volume has less than 15% free space"
          runbook: "docs/RUNBOOK.md#database-lock-hoac-wal-tang-bat-thuong"

      - alert: BiddingFlowBackupMissing
        expr: biddingflow_backup_available == 0
        for: 30m
        labels: {severity: critical, owner: platform-oncall}
        annotations:
          summary: "No verified full-state backup is visible"
          runbook: "docs/RUNBOOK.md#backup-va-restore-dien-tap"

      - alert: BiddingFlowOperationalArtifactVerifierStale
        expr: time() - biddingflow_operational_artifact_last_check_timestamp_seconds > 1800
        for: 10m
        labels: {severity: critical, owner: platform-oncall}
        annotations:
          summary: "Backup/restore artifact verification is stale"
          runbook: "docs/RUNBOOK.md#backup-va-restore-dien-tap"

      - alert: BiddingFlowBackupStale
        expr: biddingflow_backup_age_seconds > 93600
        for: 30m
        labels: {severity: critical, owner: platform-oncall}
        annotations:
          summary: "Latest verified full-state backup is older than 26 hours"
          runbook: "docs/RUNBOOK.md#backup-va-restore-dien-tap"

      - alert: BiddingFlowRestoreDrillMissing
        expr: biddingflow_restore_drill_available == 0
        for: 1h
        labels: {severity: warning, owner: platform-oncall}
        annotations:
          summary: "No verified restore-drill record is visible"
          runbook: "docs/RUNBOOK.md#backup-va-restore-dien-tap"

      - alert: BiddingFlowRestoreDrillStale
        expr: biddingflow_restore_drill_age_seconds > 3024000
        for: 1h
        labels: {severity: warning, owner: platform-oncall}
        annotations:
          summary: "Latest verified restore drill is older than 35 days"
          runbook: "docs/RUNBOOK.md#backup-va-restore-dien-tap"
